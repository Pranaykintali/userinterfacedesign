<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Lab Programs</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:950px;
            background:white;
            display:flex;
            border-radius:8px;
            overflow:hidden;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .left{
            width:45%;
            padding:30px;
        }

        .right{
            width:55%;
            padding:30px;
            border-left:1px solid #ddd;
        }

        h2{
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:15px;
            margin-bottom:18px;
            border:none;
            border-radius:6px;
            background:#4a89dc;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#3575cc;
        }

        #output{
            background:#eef1f5;
            height:330px;
            padding:20px;
            border-radius:6px;
            overflow:auto;
            font-size:18px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <h2>Functions</h2>

        <button onclick="signProduct()">
            Sign of Product
        </button>

        <button onclick="sortNumbers()">
            Sort Numbers
        </button>

        <button onclick="largestNumber()">
            Largest Number
        </button>

        <button onclick="oddEven()">
            Odd / Even 0-15
        </button>

        <button onclick="lolOk()">
            LOL / OK 1-100
        </button>

    </div>

    <div class="right">

        <h2>Output</h2>

        <div id="output">
            Result will appear here
        </div>

    </div>

</div>

<script>

// 1. Sign of Product

function signProduct(){

    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));
    let c = Number(prompt("Enter third number:"));

    let result="";

    if(a==0 || b==0 || c==0){
        result="The product is 0";
    }
    else if(a*b*c > 0){
        result="The sign is Positive (+)";
    }
    else{
        result="The sign is Negative (-)";
    }

    document.getElementById("output").innerHTML=result;
}


// 2. Sort Numbers

function sortNumbers(){

    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));
    let c = Number(prompt("Enter third number:"));

    let arr=[a,b,c];

    arr.sort(function(x,y){
        return x-y;
    });

    document.getElementById("output").innerHTML=
    "Sorted Numbers:<br><br>" +
    arr.join(" , ");
}


// 3. Largest Number

function largestNumber(){

    let a = Number(prompt("Enter number 1:"));
    let b = Number(prompt("Enter number 2:"));
    let c = Number(prompt("Enter number 3:"));
    let d = Number(prompt("Enter number 4:"));
    let e = Number(prompt("Enter number 5:"));

    let max=a;

    if(b>max) max=b;
    if(c>max) max=c;
    if(d>max) max=d;
    if(e>max) max=e;

    document.getElementById("output").innerHTML=
    "Largest Number = <b>"+max+"</b>";
}


// 4. Odd Even

function oddEven(){

    let result="";

    for(let i=0;i<=15;i++){

        if(i%2==0){
            result += i + " is EVEN<br>";
        }
        else{
            result += i + " is ODD<br>";
        }
    }

    document.getElementById("output").innerHTML=result;
}


// 5. LOL OK

function lolOk(){

    let result="";

    for(let i=1;i<=100;i++){

        if(i%3==0 && i%5==0){
            result += "LOL-OK<br>";
        }
        else if(i%3==0){
            result += "LOL<br>";
        }
        else if(i%5==0){
            result += "OK<br>";
        }
        else{
            result += i + "<br>";
        }
    }

    document.getElementById("output").innerHTML=result;
}

</script>

</body>
</html>
